# Generated: publishes the package when a tag v* is pushed and its tests pass. Do not edit, the next release replaces it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version of the package
        run: test "$GITHUB_REF_NAME" = "v1.3.1" || { echo "tag $GITHUB_REF_NAME, package v1.3.1"; exit 1; }
      - name: Wait for the SDK unione 1.3.0 in RubyGems
        timeout-minutes: 95
        run: |
          for i in $(seq 1 180); do
            if curl -fsSL -A "release-workflow (github.com/$GITHUB_REPOSITORY)" -o /tmp/sdk "https://rubygems.org/api/v2/rubygems/unione/versions/1.3.0.json"; then
              echo "unione 1.3.0 is in RubyGems"; exit 0
            fi
            echo "unione 1.3.0 is not in RubyGems yet ($i/180)"; sleep 30
          done
          echo "::error::unione 1.3.0 did not appear in RubyGems in 90 min: publish the SDK first"; exit 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: rubygems/configure-rubygems-credentials@v2.1.0  # no major tag (v1, v2) in this repository
      - run: gem build unione-rails.gemspec && gem push unione-rails-1.3.1.gem
