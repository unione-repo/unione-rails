# Generated: the tests of the package on every push and pull request (and before a release). Do not edit, the next
# release replaces it. The tests need no network: the API is faked.
name: Tests

on:
  push:
    branches: ["**"]  # not the tags: release.yml runs the tests of a tag itself
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        v: ["2.7", "3.1", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the SDK unione 1.3.0 in RubyGems
        timeout-minutes: 95
        run: |
          for i in $(seq 1 180); do
            if curl -fsSL -A "release-workflow (github.com/$GITHUB_REPOSITORY)" -o /tmp/sdk "https://rubygems.org/api/v2/rubygems/unione/versions/1.3.0.json"; then
              echo "unione 1.3.0 is in RubyGems"; exit 0
            fi
            echo "unione 1.3.0 is not in RubyGems yet ($i/180)"; sleep 30
          done
          echo "::error::unione 1.3.0 did not appear in RubyGems in 90 min: publish the SDK first"; exit 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.v }}
      - run: |
          if [ -f Gemfile ]; then bundle install; fi
          ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
