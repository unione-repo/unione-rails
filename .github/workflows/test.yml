# Generated: the tests of the package on every push and pull request (and before a release). Do not edit, the next
# release replaces it. The tests need no network: the API is faked.
name: Tests

on:
  push:
    branches: ["**"]  # not the tags: release.yml runs the tests of a tag itself
  pull_request:
  workflow_call:

permissions:
  contents: read

# a new push of the ref cancels the run of the previous one (called by release.yml: the group of the tag)
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the SDK unione 1.3.1 in RubyGems
        timeout-minutes: 15
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL -A "release-workflow (github.com/$GITHUB_REPOSITORY)" -o /tmp/sdk "https://rubygems.org/api/v2/rubygems/unione/versions/1.3.1.json"; then
              echo "unione 1.3.1 is in RubyGems"; exit 0
            fi
            echo "unione 1.3.1 is not in RubyGems yet ($i/20)"; sleep 30
          done
          echo "::error::unione 1.3.1 did not appear in RubyGems in 10 min: publish the SDK first"; exit 1
  test:
    needs: sdk
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        v: ["2.7", "3.1", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.v }}
      - name: Install the dependencies (the mirrors of the registry may serve the SDK some minutes later)
        timeout-minutes: 15
        run: |
          for i in $(seq 1 20); do
            if ( if [ -f Gemfile ]; then bundle install; fi ); then exit 0; fi
            echo "the dependencies can not be installed yet ($i/20)"; sleep 30
          done
          echo "::error::the dependencies (the SDK) can not be installed in 10 min"; exit 1
      - run: |
          if [ -f Gemfile ]; then bundle install; fi
          ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
